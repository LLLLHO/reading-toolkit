<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#4f6ef2">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>进度条工作室</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f1f5f9; --panel:#fff; --text:#1e293b; --text2:#64748b; --text3:#94a3b8;
    --border:#e2e8f0; --accent:#4f6ef2; --accent-soft:#eef1fe;
    --shadow:0 1px 2px rgba(15,23,42,.05),0 1px 3px rgba(15,23,42,.04);
    --shadow-h:0 12px 26px -14px rgba(15,23,42,.35);
  }
  html{height:100%}
  body{
    font-family:"Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    font-size:14px; line-height:1.6; color:var(--text);
    background:var(--bg); height:100%; overflow:hidden;
    display:flex; flex-direction:column;
    -webkit-font-smoothing:antialiased;
  }
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:
      radial-gradient(560px 400px at 4% -8%, rgba(147,197,253,.38), transparent 65%),
      radial-gradient(620px 420px at 98% -4%, rgba(186,230,253,.32), transparent 65%),
      linear-gradient(180deg,#f4f7fb 0%,#eef3fa 100%);}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  input,textarea{font:inherit;color:inherit}

  /* ---------------- 顶栏 ---------------- */
  header{
    flex:none; display:flex; align-items:center; gap:12px;
    padding:0 18px; height:56px;
    background:rgba(255,255,255,.72); backdrop-filter:blur(12px);
    border-bottom:1px solid var(--border); z-index:20;
  }
  .brand{display:flex;align-items:center;gap:9px;min-width:0}
  .brand .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;
    background:rgba(79,110,242,.12);color:var(--accent);flex:none}
  .brand .ic svg{width:16px;height:16px}
  .brand h1{font-size:15px;font-weight:600;letter-spacing:.3px;white-space:nowrap}
  .brand .sp{color:var(--text3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grow{flex:1}
  .btn{
    height:31px;padding:0 13px;border-radius:8px;font-size:13px;
    border:1px solid var(--border);background:#fff;color:var(--text2);
    display:inline-flex;align-items:center;gap:6px;white-space:nowrap;
    transition:.15s ease; box-shadow:var(--shadow);
  }
  .btn:hover{color:var(--text);border-color:#cbd5e1;transform:translateY(-1px)}
  .btn:active{transform:translateY(0)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 2px 8px -2px rgba(79,110,242,.55)}
  .btn.pri:hover{background:#4460e0;border-color:#4460e0;color:#fff}
  .btn svg{width:14px;height:14px;flex:none}
  .btn[disabled]{opacity:.42;cursor:not-allowed;transform:none}

  /* ---------------- 主区 ---------------- */
  main{flex:1;display:flex;min-height:0}

  /* 左栏 */
  .list{width:290px;flex:none;display:flex;flex-direction:column;min-height:0;
    background:rgba(255,255,255,.6);border-right:1px solid var(--border)}
  .lstTop{flex:none;padding:12px 12px 8px;display:flex;gap:8px;align-items:center}
  .srch{flex:1;position:relative}
  .srch input{width:100%;height:31px;padding:0 10px 0 30px;border-radius:8px;
    border:1px solid var(--border);background:#fff;font-size:13px;outline:0}
  .srch input:focus{border-color:rgba(79,110,242,.5);box-shadow:0 0 0 3px rgba(79,110,242,.10)}
  .srch svg{position:absolute;left:9px;top:8px;width:15px;height:15px;color:var(--text3)}
  .lstBody{flex:1;overflow:auto;padding:2px 10px 10px;min-height:0}
  .lstBody::-webkit-scrollbar{width:8px}
  .lstBody::-webkit-scrollbar-thumb{background:#dbe3ee;border-radius:4px;border:2px solid transparent;background-clip:content-box}
  .cnt{font-size:11.5px;color:var(--text3);padding:0 4px 6px;letter-spacing:.3px}

  .row{border:1px solid var(--border);border-radius:10px;background:#fff;
    padding:7px;margin-bottom:8px;cursor:pointer;transition:.15s ease;box-shadow:var(--shadow)}
  .row:hover{border-color:#c7d3e6;transform:translateY(-1px);box-shadow:var(--shadow-h)}
  .row.on{border-color:rgba(79,110,242,.65);background:var(--accent-soft);
    box-shadow:0 0 0 3px rgba(79,110,242,.10)}
  .row .bar{height:38px;border-radius:6px;overflow:hidden;display:flex;align-items:center;
    justify-content:center;background:#2f2f34}
  .row .bar img{width:100%;height:100%;object-fit:contain;display:block;
    filter:contrast(1.16) brightness(1.14)}
  .row .bar .empty{font-size:11px;color:#8b93a1;letter-spacing:.3px}
  .row .foot{display:flex;align-items:center;gap:5px;margin-top:6px}
  .row .nm{flex:1;min-width:0;border:1px solid transparent;background:none;border-radius:5px;
    padding:2px 5px;font-size:12.5px;font-weight:600;color:var(--text);outline:0;
    text-overflow:ellipsis}
  .row .nm:hover{border-color:var(--border);background:#fff}
  .row .nm:focus{border-color:rgba(79,110,242,.55);background:#fff}
  .row .x{width:22px;height:22px;border-radius:5px;color:var(--text3);font-size:15px;
    line-height:1;display:grid;place-items:center;flex:none;opacity:0;transition:.15s}
  .row:hover .x{opacity:1}
  .row .x:hover{background:rgba(220,38,38,.1);color:#dc2626}
  @media (hover:none){ .row .x{opacity:.45} }   /* 触屏没有 hover，别把删除藏起来 */
  .row .tag{font-size:10px;padding:1px 5px;border-radius:4px;background:#eef2f7;
    color:var(--text3);flex:none;letter-spacing:.3px}

  /* 左栏底部设置 */
  .cfg{flex:none;border-top:1px solid var(--border);padding:11px 12px 13px;
    background:rgba(255,255,255,.92);display:flex;flex-direction:column;gap:9px;
    box-shadow:0 -8px 16px -12px rgba(15,23,42,.28);position:relative;z-index:2}
  .cfgLbl{font-size:11px;color:var(--text3);letter-spacing:.6px;margin-bottom:4px;display:block}
  .segs{display:flex;gap:4px;flex-wrap:wrap}
  .seg{height:26px;padding:0 9px;border-radius:6px;font-size:12px;color:var(--text2);
    border:1px solid var(--border);background:#fff;transition:.13s}
  .seg:hover{border-color:#cbd5e1;color:var(--text)}
  .seg.on{background:var(--accent);border-color:var(--accent);color:#fff;
    box-shadow:0 1px 5px -1px rgba(79,110,242,.5)}
  .bgsw{display:flex;gap:6px}
  .bgsw i{width:26px;height:26px;border-radius:7px;border:2px solid transparent;cursor:pointer;
    display:block;box-shadow:inset 0 0 0 1px rgba(15,23,42,.12);transition:.13s}
  .bgsw i:hover{transform:translateY(-1px)}
  .bgsw i.on{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
  .inkrow{display:flex;align-items:center;gap:8px}
  .inkrow input[type=color]{width:28px;height:26px;padding:0;border:1px solid var(--border);
    border-radius:6px;background:#fff;cursor:pointer}
  .inkrow input[type=text]{width:78px;height:26px;padding:0 7px;border-radius:6px;
    border:1px solid var(--border);background:#fff;font-size:12px;font-family:ui-monospace,monospace;outline:0}
  .hk{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--text2);cursor:pointer;user-select:none}
  .hk input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer}

  /* ---------------- 右栏：选中这一条 ---------------- */
  .insp{width:296px;flex:none;display:flex;flex-direction:column;min-height:0;
    background:rgba(255,255,255,.72);border-left:1px solid var(--border)}
  .inspH{flex:none;padding:12px 14px 7px;display:flex;align-items:center;gap:6px;
    font-size:11.5px;color:var(--text3);letter-spacing:.5px}
  .inspH b{font-size:13px;color:var(--text);font-weight:600;letter-spacing:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .inspBody{flex:1;overflow:auto;padding:2px 14px 14px;min-height:0}
  .inspBody::-webkit-scrollbar{width:8px}
  .inspBody::-webkit-scrollbar-thumb{background:#dbe3ee;border-radius:4px;border:2px solid transparent;background-clip:content-box}
  .insEmpty{font-size:12px;color:var(--text3);line-height:1.95;padding:22px 4px;text-align:center}
  .insG{margin-bottom:13px}
  .insG>label{display:flex;align-items:center;justify-content:space-between;
    font-size:11.5px;color:var(--text3);letter-spacing:.4px;margin-bottom:5px}
  .insG>label b{color:var(--text2);font-weight:600;font-variant-numeric:tabular-nums;font-size:11.5px}
  .insIn{width:100%;height:29px;padding:0 8px;border-radius:7px;border:1px solid var(--border);
    background:#fff;font-size:13px;outline:0}
  .insIn:focus{border-color:rgba(79,110,242,.5);box-shadow:0 0 0 3px rgba(79,110,242,.10)}
  .insRow{display:flex;align-items:center;gap:7px}
  .insRow .sw{width:32px;height:29px;padding:0;border:1px solid var(--border);border-radius:7px;
    background:#fff;cursor:pointer;flex:none}
  .insRow .hx{width:86px;height:29px;padding:0 7px;border-radius:7px;border:1px solid var(--border);
    background:#fff;font-size:12px;font-family:ui-monospace,monospace;outline:0;flex:none}
  .insRow .hx:focus{border-color:rgba(79,110,242,.5)}
  .insAct{display:flex;gap:7px;flex-wrap:wrap;margin-top:2px}
  .insAct .btn{height:28px;font-size:12px;padding:0 10px}
  .insTip{font-size:11px;color:var(--text3);line-height:1.75;margin-top:11px;
    padding-top:10px;border-top:1px dashed var(--border)}
  .dirty{font-size:10px;color:#b45309;background:#fef3c7;padding:0 5px;border-radius:4px;
    letter-spacing:.3px;flex:none}
  .pick{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:9px;
    border:1px dashed #c7d3e6;background:#f8fbff}
  .pick .mini{line-height:1.6}

  /* 舞台 */
  .stagecol{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0}
  .stagewrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    padding:22px 22px 8px;overflow:auto;position:relative}
  .stagewrap::before{content:"";position:absolute;inset:0;pointer-events:none;
    background-image:radial-gradient(circle,rgba(100,116,139,.13) 1px,transparent 1px);
    background-size:16px 16px;opacity:.55;mask-image:radial-gradient(ellipse 70% 70% at 50% 50%,#000 30%,transparent 100%)}
  .zoomCtl{position:absolute;top:10px;left:12px;display:flex;gap:3px;z-index:5;
    background:rgba(255,255,255,.92);border:1px solid var(--border);border-radius:9px;
    padding:3px;box-shadow:var(--shadow);backdrop-filter:blur(6px)}
  .zoomCtl button{width:30px;height:22px;border-radius:6px;font-size:11.5px;color:var(--text2);
    transition:.13s;font-variant-numeric:tabular-nums}
  .zoomCtl button:hover{background:#f1f5f9;color:var(--text)}
  .zoomCtl button.on{background:var(--accent);color:#fff}
  /* 垫片不能有过渡：内层 scale 是立即生效的，垫片若还在慢慢长，两者对不上，
     纸面会在过渡的一瞬跑到右边溢出屏幕 */
  .paperFit{flex:none;position:relative}
  .paper{
    position:absolute;top:0;left:0;
    display:flex;flex-direction:column;justify-content:flex-end;
    height:212px;border-radius:14px;padding:0 0 20px;
    box-shadow:0 14px 34px -18px rgba(15,23,42,.55),0 0 0 1px rgba(15,23,42,.07);
    transform-origin:top left;
    transition:width .28s cubic-bezier(.4,0,.2,1),transform .22s cubic-bezier(.4,0,.2,1);
    overflow:hidden;
  }
  .paper .cap{position:absolute;left:18px;top:16px;font-size:12px;letter-spacing:1.5px;
    opacity:.34;font-weight:600;pointer-events:none}
  .paper .lines{position:absolute;left:18px;right:18px;top:44px;display:flex;flex-direction:column;
    gap:9px;opacity:.13;pointer-events:none}
  .paper .lines i{display:block;height:7px;border-radius:4px;background:currentColor}
  .paper .lines i:nth-child(2){width:88%}
  .paper .lines i:nth-child(4){width:72%}
  .paper .barwrap{flex:none;padding:0 16px;width:100%;position:relative;z-index:2}
  #view{display:block;width:100%}
  .stageNote{position:absolute;left:0;right:0;bottom:2px;text-align:center;
    font-size:11.5px;color:var(--text3);letter-spacing:.3px}
  .zoomBadge{position:absolute;top:12px;right:14px;font-size:11px;color:var(--text3);
    background:rgba(255,255,255,.9);border:1px solid var(--border);border-radius:20px;
    padding:2px 9px;box-shadow:var(--shadow)}

  /* 控制条 */
  .ctrl{flex:none;border-top:1px solid var(--border);background:rgba(255,255,255,.75);
    backdrop-filter:blur(10px);padding:11px 20px 14px;display:flex;flex-direction:column;gap:9px}
  .prow{display:flex;align-items:center;gap:12px}
  .prow .lab{font-size:12px;color:var(--text3);width:34px;flex:none;letter-spacing:.5px}
  .rng{flex:1;position:relative;height:24px;display:flex;align-items:center}
  input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:3px;
    background:linear-gradient(90deg,var(--accent) 0%,var(--accent) var(--pp,45%),#e2e8f0 var(--pp,45%),#e2e8f0 100%);
    outline:0;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;
    background:#fff;border:2px solid var(--accent);box-shadow:0 1px 4px rgba(15,23,42,.28);cursor:grab}
  input[type=range]::-webkit-slider-thumb:active{cursor:grabbing;transform:scale(1.08)}
  input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:#fff;
    border:2px solid var(--accent);box-shadow:0 1px 4px rgba(15,23,42,.28)}
  .pval{font-size:12.5px;font-weight:600;color:var(--accent);width:46px;text-align:right;flex:none;
    font-variant-numeric:tabular-nums}
  .prow2{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .navb{width:28px;height:28px;border-radius:7px;border:1px solid var(--border);background:#fff;
    display:grid;place-items:center;color:var(--text2);transition:.13s}
  .navb:hover{border-color:#cbd5e1;color:var(--text);background:#f8fafc}
  .navb svg{width:14px;height:14px}
  .pgnum{font-size:12.5px;color:var(--text2);font-variant-numeric:tabular-nums;min-width:64px;text-align:center}
  .pgnum b{color:var(--text);font-weight:600}
  .sep{width:1px;height:18px;background:var(--border);margin:0 3px}
  .mini{font-size:11.5px;color:var(--text3);letter-spacing:.2px}
  .meta{font-size:11.5px;color:var(--text3);display:flex;gap:14px;flex-wrap:wrap;line-height:1.7}
  .meta b{color:var(--text2);font-weight:600}
  .meta .warn{color:#c2410c}

  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(15,23,42,.42);z-index:100;
    display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(3px)}
  .mask.on{display:flex}
  .dlg{background:#fff;border-radius:14px;box-shadow:0 24px 60px -20px rgba(15,23,42,.5);
    width:100%;max-width:560px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
  .dlgH{flex:none;display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)}
  .dlgH h2{font-size:14.5px;font-weight:600;flex:1}
  .dlgB{padding:14px 16px;overflow:auto;display:flex;flex-direction:column;gap:10px}
  .dlgB textarea{width:100%;height:180px;padding:10px;border-radius:8px;border:1px solid var(--border);
    background:#f8fafc;font-family:ui-monospace,Consolas,monospace;font-size:12px;resize:vertical;
    line-height:1.55;outline:0}
  .dlgB textarea:focus{border-color:rgba(79,110,242,.5);box-shadow:0 0 0 3px rgba(79,110,242,.10)}
  .dlgF{flex:none;padding:11px 16px;border-top:1px solid var(--border);display:flex;gap:8px;
    justify-content:flex-end;background:#fbfcfe}
  .res{font-size:12px;line-height:1.8;padding:9px 11px;border-radius:8px;background:#f8fafc;
    border:1px solid var(--border);color:var(--text2)}
  .res.ok{background:#f0fdf4;border-color:#bbf7d0;color:#15803d}
  .res.bad{background:#fef2f2;border-color:#fecaca;color:#b91c1c}
  .res code{font-family:ui-monospace,monospace;background:rgba(15,23,42,.06);
    padding:1px 4px;border-radius:3px;font-size:11.5px}
  .hint{font-size:11.5px;color:var(--text3);line-height:1.75}
  .hint code{font-family:ui-monospace,monospace;background:#eef2f7;padding:1px 4px;border-radius:3px;font-size:11px}

  .toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,14px);z-index:300;
    background:rgba(30,41,59,.94);color:#fff;font-size:13px;padding:9px 17px;border-radius:9px;
    box-shadow:0 10px 30px -8px rgba(15,23,42,.6);opacity:0;pointer-events:none;transition:.22s;
    max-width:80vw;text-align:center}
  .toast.on{opacity:1;transform:translate(-50%,0)}

  /* 拖放 */
  .drop{position:fixed;inset:0;z-index:200;background:rgba(79,110,242,.10);
    border:3px dashed rgba(79,110,242,.55);display:none;align-items:center;justify-content:center;
    font-size:17px;font-weight:600;color:var(--accent);backdrop-filter:blur(2px)}
  .drop.on{display:flex}

  /* ---------------- 窄屏 ---------------- */
  @media (max-width:880px){
    header{padding:0 10px;gap:6px;height:52px}
    .brand{gap:6px}
    .brand .sp{display:none}
    .brand h1{font-size:13.5px;letter-spacing:0}
    .brand .ic{width:24px;height:24px;border-radius:7px}
    .brand .ic svg{width:14px;height:14px}
    .btn{padding:0 8px;font-size:12px;height:28px;gap:4px;border-radius:7px}
    .btn svg{width:13px;height:13px}
    /* 手机上三块纵向叠：舞台 → 列表（压成横向滑条，切条不用滚半页）→ 选中这条 */
    main{flex-direction:column;overflow-y:auto;overflow-x:hidden}
    .stagecol{order:1;flex:none;min-height:0}
    .list{order:2;width:auto;flex:none;border-right:0;border-top:1px solid var(--border)}
    .lstBody{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;max-height:none;padding:0 10px 9px}
    .lstBody::-webkit-scrollbar{height:0}
    .row{flex:none;width:152px;margin-bottom:0}
    .insp{order:3;width:auto;flex:none;border-left:0;border-top:1px solid var(--border);
      background:rgba(255,255,255,.9)}
    .inspBody{overflow:visible;padding-bottom:16px}
    .lstTop{padding:9px 10px 6px}
    .lstBody{padding:0 10px 10px}
    /* 手机上设置不能藏起来：压成横向一条，左右滑 */
    .cfg{flex-direction:row;align-items:flex-end;gap:16px;overflow-x:auto;overflow-y:hidden;
      padding:8px 10px 10px}
    .cfg>div{flex:none}
    .cfgLbl{margin-bottom:3px;white-space:nowrap}
    .stagewrap{padding:12px 10px 2px;height:238px;flex:none}
    .paper{height:160px;padding-bottom:14px}
    .ctrl{padding:8px 12px 11px;gap:7px}
    .prow .lab{width:26px;font-size:11px}
    .pval{width:42px;font-size:12px}
    .prow2 .mini,.prow2 .sep{display:none}
    .meta{font-size:10.5px;gap:8px}
    .zoomBadge{top:6px;right:8px;font-size:10px;padding:1px 7px}
    .zoomCtl{top:6px;left:8px}
    .stageNote{display:none}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h4M9 12h3M14 12h7"/><circle cx="7.5" cy="12" r="2.2" fill="currentColor" stroke="none"/></svg></span>
    <h1>进度条工作室</h1>
    <span class="sp">本章进度 → 图形，翻一页变一帧</span>
  </div>
  <div class="grow"></div>
  <button class="btn" id="btnImport"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>导入</button>

<script>
/* =========================================================================
   1. 解析核心 —— 与 template-maker.html 里那套完全一致
      约束：表达式只能用 数字 四则 括号 逗号 + 12 个变量 + 8 个函数
   ========================================================================= */
var PBAR_ARGS = ['chapterPct', 'progress', 'chapterProgress', 'chapterPercent', 'percent', 'pct',
  'bookPct', 'bookPercent', 'pageIndex', 'page', 'pageCount', 'total'];
var PBAR_HELPERS = ['min', 'max', 'abs', 'round', 'floor', 'ceil', 'pow', 'sqrt'];
var PBAR_SIG = PBAR_ARGS.join(', ');
var PBAR_BARE = {
  chapterPct: 'chapterPct', chapterProgress: 'chapterProgress', chapterPercent: 'chapterPercent',
  progress: 'progress', percent: 'percent', pct: 'pct',
  bookPct: 'bookPct', bookPercent: 'bookPercent',
  pageIndex: 'pageIndex', page: 'page', pageCount: 'pageCount', total: 'total'
};
function n2(v, d){ var x = Number(v); return isFinite(x) ? x : d; }
function esc(s){
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

/* 画布尺寸：scale({= w / N}) → 数字 viewBox → svg width/height → 300×100 */
function pbarCanvasOf(text){
  var s = String(text || '');
  var sc = s.match(/scale\(\s*\{=\s*w\s*\/\s*([0-9.]+)\s*\}[\s,]+(?:\{=\s*)?h\s*\/\s*([0-9.]+)/);
  var w = sc ? parseFloat(sc[1]) : 0, h = sc ? parseFloat(sc[2]) : 0;
  if (!w) w = (s.match(/\bw\s*\/\s*([0-9.]+)/) || [])[1] * 1 || 0;
  if (!h) h = (s.match(/\bh\s*\/\s*([0-9.]+)/) || [])[1] * 1 || 0;
  var vb = String((s.match(/viewBox="([^"]*)"/) || [])[1] || '').trim().split(/[\s,]+/).map(Number);
  if (vb.length === 4 && isFinite(vb[2]) && isFinite(vb[3]) && vb[2] > 0 && vb[3] > 0){ w = vb[2]; h = vb[3]; }
  if (!(w > 0)) w = parseFloat((s.match(/<svg[^>]*\swidth="([0-9.]+)"/) || [])[1]) || 0;
  if (!(h > 0)) h = parseFloat((s.match(/<svg[^>]*\sheight="([0-9.]+)"/) || [])[1]) || 0;
  if (!(w > 0) || !(h > 0)){ w = 300; h = 100; }
  return { w: w, h: h, em: Math.max(8, Math.round(h * 0.16)) };
}
/* 摊平：{w}{h}{em} → 数字；{chapterPct} 裸占位符 → {= chapterPct }；表达式里的 w/h/em 也换数字 */
function pbarPrep(text, cv){
  var c = cv || pbarCanvasOf(text);
  var s = String(text == null ? '' : text);
  s = s.replace(/\{([A-Za-z][A-Za-z0-9]*)\}/g, function(m, name){
    if (name === 'w') return String(n2(c.w, 300));
    if (name === 'h') return String(n2(c.h, 100));
    if (name === 'em') return String(n2(c.em, 14));
    if (PBAR_BARE[name]) return '{=' + PBAR_BARE[name] + '}';
    return m;
  });
  s = s.replace(/\{=([^}]*)\}/g, function(m, body){
    return '{=' + body.replace(/\b(w|h|em)\b/g, function(k){ return String(n2(c[k], 0)); }) + '}';
  });
  return s;
}
function pbarBadExpr(e){
  var s = String(e == null ? '' : e).trim();
  if (!s) return '空表达式';
  if (/[^0-9A-Za-z_+\-*\/().,\s]/.test(s)) return '含不支持的字符';
  var ids = s.match(/[A-Za-z_][A-Za-z0-9_]*/g) || [];
  for (var i = 0; i < ids.length; i++){
    if (PBAR_ARGS.indexOf(ids[i]) < 0 && PBAR_HELPERS.indexOf(ids[i]) < 0) return '不认识的变量 ' + ids[i];
  }
  return '';
}
function pbarTplBody(val){
  var parts = String(val).split(/\{=([^}]*)\}/);
  var toks = [];
  for (var i = 0; i < parts.length; i++){
    if (i % 2 === 0){
      if (parts[i]) toks.push(JSON.stringify(parts[i]));
    } else {
      var bad = pbarBadExpr(parts[i]);
      if (bad) return { err: bad };
      toks.push('n(' + parts[i].trim() + ')');
    }
  }
  return { body: 'return ' + (toks.length ? toks.join(' + ') : '""') + ';' };
}

var PBAR_CACHE = new Map();
/* 解析一条 SVG：收集「哪个元素、哪个属性、用哪个函数」；顺带处理 data-progress + clipPath 的裁剪型 */
function pbarCompile(text){
  var key = String(text == null ? '' : text);
  if (PBAR_CACHE.has(key)) return PBAR_CACHE.get(key);
  var out = { fns: [], rows: [], bad: [], err: '', svg: key, canvas: null, clipRows: 0 };
  try {
    var cv = pbarCanvasOf(key);
    var prepped = pbarPrep(key, cv);
    out.canvas = cv;
    out.svg = prepped;
    var box = document.createElement('div');
    box.innerHTML = prepped;
    var svg = box.querySelector('svg');
    if (!svg){ out.err = '没找到 <svg> 标签'; PBAR_CACHE.set(key, out); return out; }
    var els = [svg].concat(Array.prototype.slice.call(svg.querySelectorAll('*')));
    var seen = new Map();
    els.forEach(function(el, ei){
      var at = el.attributes;
      for (var k = 0; k < at.length; k++){
        var name = at[k].name, val = at[k].value;
        if (val.indexOf('{=') < 0) continue;
        var c = pbarTplBody(val);
        if (c.err){ out.bad.push(name + '：' + c.err); continue; }
        var fi = seen.get(val);
        if (fi == null){ fi = out.fns.length; seen.set(val, fi); out.fns.push(c.body); }
        out.rows.push([ei, name, fi]);
      }
    });
    /* 裁剪型：data-progress + clipPath，把裁剪矩形的宽按进度缩放 */
    var idxMap = new Map();
    els.forEach(function(el, i){ idxMap.set(el, i); });
    var used = {};
    Array.prototype.slice.call(svg.querySelectorAll('[data-progress]')).forEach(function(node){
      var host = node.getAttribute('clip-path') ? node : (node.querySelector('[clip-path]') || node);
      var cp = String(host.getAttribute('clip-path') || '');
      var m = cp.match(/url\(\s*#([^)'"]+)\s*\)/);
      if (!m) return;
      var cpEl = Array.prototype.slice.call(svg.querySelectorAll('[id]')).filter(function(x){ return x.id === m[1]; })[0];
      if (!cpEl) return;
      var r = cpEl.querySelector('rect') || cpEl.querySelector('*');
      if (!r) return;
      var base = parseFloat(r.getAttribute('width'));
      if (!(base > 0)) return;
      var ei = idxMap.get(r);
      if (ei == null || used[ei + ':width']) return;
      used[ei + ':width'] = 1;
      var body = 'return n(' + base + ' * chapterPct / 100);';
      var fi2 = out.fns.indexOf(body);
      if (fi2 < 0){ fi2 = out.fns.length; out.fns.push(body); }
      out.rows.push([ei, 'width', fi2]);
      out.clipRows++;
    });
  } catch (e){ out.err = e.message; }
  PBAR_CACHE.set(key, out);
  return out;
}

var PBAR_FN_CACHE = new Map();
function pbarFnOf(body){
  if (PBAR_FN_CACHE.has(body)) return PBAR_FN_CACHE.get(body);
  var f = null;
  try {
    f = new Function(PBAR_SIG, 'var ' + PBAR_HELPERS.map(function(h){ return h + '=Math.' + h; }).join(',')
      + '; function n(v){ return Math.round(v * 1000) / 1000; }\n' + body);
  } catch (e){ f = null; }
  PBAR_FN_CACHE.set(body, f);
  return f;
}
function pbarArgVal(a, pct, i, count){
  if (a === 'pageIndex') return i + 1;
  if (a === 'pageCount' || a === 'total') return count;
  if (a === 'page') return (i + 1) + '/' + count;
  return pct;
}
/* 给 id 加后缀，避免同页多份 SVG 抢渐变 */
function pbarUniq(markup, sfx){
  var s = String(markup || '');
  if (s.indexOf('id="') < 0) return s;
  var ids = [];
  s = s.replace(/\sid="([^"]+)"/g, function(m, id){ ids.push(id); return ' id="' + id + sfx + '"'; });
  ids.forEach(function(id){
    var q = id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    s = s.replace(new RegExp('url\\(#' + q + '\\)', 'g'), 'url(#' + id + sfx + ')');
    s = s.replace(new RegExp('href="#' + q + '"', 'g'), 'href="#' + id + sfx + '"');
  });
  return s;
}
/* 按背景亮度挑一块反差的板（缩略图用） */
function thumbPlate(color){
  var m = /^#([0-9a-fA-F]{6})$/.exec(String(color || '').trim());
  if (!m) return { bg: '#2f2f34', fg: '#d8d8d8' };
  var n = parseInt(m[1], 16), r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  return lum < 0.5 ? { bg: '#f4f4f5', fg: color } : { bg: '#2f2f34', fg: color };
}
/* 机制标签：从写法猜它靠什么在动 —— 只为了列表里好认，不进导出 */
function mechOf(svg){
  var t = [];
  if (/data-progress\s*=/.test(svg)) t.push('裁剪生长');
  else if (/clipPath/.test(svg)) t.push('clip 限制');
  if (/dashoffset/.test(svg)) t.push('描边生长');
  if (/translate\(\s*\{=/.test(svg)) t.push('整体跟随');
  if (/radialGradient/.test(svg)) t.push('光晕');
  if (/<ellipse/.test(svg) && /opacity=\s*\{=/.test(svg)) t.push('多层亮度');
  if (/data-reader-field/.test(svg)) t.push('阅读器填字');
  if (!t.length) t.push('属性递增');
  return t.join(' · ');
}
function nameOf(svgText, fileName){
  var nm = '';
  try {
    var box = document.createElement('div'); box.innerHTML = svgText;
    var svg = box.querySelector('svg');
    if (svg){
      var t = svg.querySelector('title');
      if (t) nm = String(t.textContent || '').trim();
      if (!nm) nm = String(svg.getAttribute('data-name') || '').trim();
    }
  } catch (e){}
  if (!nm && fileName){
    nm = String(fileName).replace(/\.(svg|txt)$/i, '')
      .replace(/^(ARC|Lovia|Reeden)[-_—\s]*/i, '')
      .replace(/[（(][^）)]*$/, '')
      .replace(/[-_\s]+$/, '');
  }
  nm = String(nm).replace(/\s+/g, ' ').trim().slice(0, 24);
  return nm || '未命名';
}

/* =========================================================================
   2. 数据

var LSKEY = 'pbarStudio.v1';
var store = { custom: [], ov: {}, hide: [], state: null };
try {
  var raw = localStorage.getItem(LSKEY);
  if (raw){
    var o = JSON.parse(raw);
    if (o && Array.isArray(o.custom)) store.custom = o.custom;
    if (o && o.ov && typeof o.ov === 'object') store.ov = o.ov;
    if (o && Array.isArray(o.hide)) store.hide = o.hide;
    if (o && o.state) store.state = o.state;
  }
} catch (e){}
/* 自定义条目必须有稳定 id：早先是拿下标当 id，删一条之后后面的全错位，
   改过的颜色/大小就会跑到别人身上 */
(function(){
  store.custom.forEach(function(c, i){
    if (!c.id) c.id = 'u' + Date.now().toString(36) + '-' + i;
  });
})();
function saveStore(){
  try { localStorage.setItem(LSKEY, JSON.stringify({ custom: store.custom, ov: store.ov, hide: store.hide, state: state })); } catch (e){}
}

var state = Object.assign({
  sel: '',
  pct: 45,
  count: 12,
  width: 360,
  customW: 360,
  zoom: 1,
  bg: '#ffffff',
  ink: '#2f3440',
  showLines: true,
  fillField: true
}, store.state || {});
delete state.follow;        /* 旧版本遗留，现在颜色按条记 */
delete state.custom_ink;

/* 每条的改动：{ c 颜色, op 不透明度, sc 大小%, dx/dy 位置%, name, src 改过的源码 } */
function ovOf(id){ return store.ov[id] || {}; }
function hasOv(id){ var o = store.ov[id]; return !!o && Object.keys(o).length > 0; }
function setOv(id, patch){
  var o = store.ov[id] || {}, k;
  for (k in patch){
    if (patch[k] === '' || patch[k] === null || patch[k] === undefined) delete o[k];
    else o[k] = patch[k];
  }
  if (Object.keys(o).length) store.ov[id] = o; else delete store.ov[id];
  saveStore();
}

/* items：内置在前、自定义在后；都套上各自的改动 */
function allItems(){
  var out = [];
  BUILTIN.forEach(function(b, i){
    var id = 'b' + i;
    if (store.hide.indexOf(id) >= 0) return;
    var ov = store.ov[id] || {};
    out.push({ id: id, name: ov.name || b[0], svg: ov.src || b[1], builtin: true, dirty: hasOv(id) });
  });
  store.custom.forEach(function(c, i){
    var id = c.id || ('c' + i);
    if (store.hide.indexOf(id) >= 0) return;
    var ov = store.ov[id] || {};
    out.push({ id: id, name: ov.name || c.name, svg: ov.src || c.svg, builtin: false, dirty: hasOv(id) });
  });
  return out;
}
function itemById(id){
  var a = allItems();
  for (var i = 0; i < a.length; i++) if (a[i].id === id) return a[i];
  return null;
}

/* ---------------- 几何：从 svg 文本读画布，算出「改过之后」的 viewBox ---------------- */
function baseVB(svgText){
  var m = /<svg\b[^>]*\bviewBox\s*=\s*"([^"]*)"/i.exec(String(svgText || ''));
  if (m){
    var a = m[1].trim().split(/[\s,]+/).map(Number);
    if (a.length === 4 && a[2] > 0 && a[3] > 0) return { x: a[0], y: a[1], w: a[2], h: a[3] };
  }
  var c = pbarCanvasOf(String(svgText || ''));
  return { x: 0, y: 0, w: c.w || 300, h: c.h || 100 };
}
/* 大小 = 把画布放大（图形相对变小，比例不变）；位置 = 画布中心平移 */
function vbFor(base, ov){
  var sc = Math.max(40, Math.min(100, ov.sc == null ? 100 : ov.sc));
  var k = 100 / sc;
  var nw = base.w * k, nh = base.h * k;
  var cx = base.x + base.w / 2 + (ov.dx || 0) / 100 * base.w;
  var cy = base.y + base.h / 2 + (ov.dy || 0) / 100 * base.h;
  return { x: cx - nw / 2, y: cy - nh / 2, w: nw, h: nh };
}
function vbStr(v){
  return [v.x, v.y, v.w, v.h].map(function(n){ return Math.round(n * 100) / 100; }).join(' ');
}


/* =========================================================================
   3. 列表
   ========================================================================= */
var lstBody = document.getElementById('lstBody');
var cntEl = document.getElementById('cnt');
var qEl = document.getElementById('q');
var THUMB_CACHE = new Map();

function thumbHTML(it){
  var ov = ovOf(it.id);
  var ck = it.id + '|' + (ov.c || '') + '|' + (ov.sc || 100) + '|' + it.svg.length + '|' + it.svg.slice(0, 60);
  if (THUMB_CACHE.has(ck)) return THUMB_CACHE.get(ck);
  var out = '';
  try {
    var c = pbarCompile(it.svg);
    if (!c.err && c.rows.length){
      var holder = document.createElement('div');
      holder.innerHTML = pbarUniq(c.svg, '-t');
      var svg = holder.querySelector('svg');
      if (svg){
        if (!svg.getAttribute('viewBox')) svg.setAttribute('viewBox', '0 0 ' + c.canvas.w + ' ' + c.canvas.h);
        svg.removeAttribute('width'); svg.removeAttribute('height');
        var els = [svg].concat(Array.prototype.slice.call(svg.querySelectorAll('*')));
        var i = 2, count = 3, p = 66;
        for (var r = 0; r < c.rows.length; r++){
          var el = els[c.rows[r][0]], f = pbarFnOf(c.fns[c.rows[r][2]]);
          if (!el || !f) continue;
          var args = PBAR_ARGS.map(function(a){ return pbarArgVal(a, p, i, count); });
          try { el.setAttribute(c.rows[r][1], f.apply(null, args)); } catch (e){}
        }
        Array.prototype.forEach.call(svg.querySelectorAll('[data-reader-field]'), function(tx){
          var k = String(tx.getAttribute('data-reader-field') || '');
          if (/page/i.test(k)) tx.textContent = (i + 1) + '/' + count;
          else if (/progress|percent|pct/i.test(k)) tx.textContent = p + '%';
        });
        svg.setAttribute('viewBox', vbStr(vbFor(baseVB(it.svg), ov)));
        svg.setAttribute('color', ov.c || '#dcdcdc');
        if (!svg.getAttribute('xmlns')) svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
        out = '<img src="data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.outerHTML) + '" alt="">';
      }
    }
  } catch (e){}
  if (!out) out = '<span class="empty">图形没解析出来</span>';
  THUMB_CACHE.set(ck, out);
  return out;
}

function renderList(){
  var q = String(qEl.value || '').trim().toLowerCase();
  var list = allItems().filter(function(it){
    if (!q) return true;
    var mech = mechOf(it.svg).toLowerCase();
    return it.name.toLowerCase().indexOf(q) >= 0 || mech.indexOf(q) >= 0;
  });
  cntEl.innerHTML = list.length + ' 条' + (q ? ' / 共 ' + allItems().length : '')
    + (store.hide.length ? ' · <button class="seg" id="unhide" style="height:20px;padding:0 6px;font-size:11px;vertical-align:middle">恢复 ' + store.hide.length + ' 条</button>' : '');
  if (!list.length){
    lstBody.innerHTML = '<div style="padding:26px 10px;text-align:center;color:var(--text3);font-size:12.5px;line-height:1.9">'
      + '没匹配的条目<br><span style="font-size:11.5px">点右上「导入」选 .svg / .txt，或直接把文件拖进来</span></div>';
    return;
  }
  lstBody.innerHTML = list.map(function(it){
    return '<div class="row' + (it.id === state.sel ? ' on' : '') + '" data-id="' + it.id + '">'
      + '<div class="bar">' + thumbHTML(it) + '</div>'
      + '<div class="foot"><input class="nm" value="' + esc(it.name) + '" data-nm="' + it.id + '"'
      + ' title="点一下就能改名">'
      + (it.dirty ? '<span class="dirty">已改</span>' : '')
      + '<span class="tag">' + (it.builtin ? '内置' : '导入') + '</span>'
      + '<button class="x" data-del="' + it.id + '" title="删除">×</button>'
      + '</div></div>';
  }).join('');
}

/* =========================================================================
   4. 舞台（Shadow DOM 隔离，外部 SVG 里带 <style> 也不会污染本页）
   ========================================================================= */
var viewEl = document.getElementById('view');
var root = viewEl.attachShadow ? (viewEl.shadowRoot || viewEl.attachShadow({ mode: 'open' })) : viewEl;
root.innerHTML = '<style>:host{display:block;width:100%}'
  + 'svg{display:block;width:100%;height:auto;overflow:visible}</style>';

var CUR = null;   /* { rows, fns, els, svg } */

/* 清空 shadow root 里除 <style> 以外的节点 —— 之前写成「碰到 style 就 break」，
   结果每切一条进度条就往上叠一条，看起来像两条打架 */
function clearView(){
  var kids = Array.prototype.slice.call(root.childNodes);
  kids.forEach(function(n){
    if (n.nodeType === 1 && n.tagName === 'STYLE') return;
    root.removeChild(n);
  });
}
function showViewMsg(text){
  clearView();
  var p = document.createElement('div');
  p.style.cssText = 'font-size:12px;color:#b91c1c;padding:10px 0;text-align:center';
  p.textContent = text;
  root.appendChild(p);
}

function mount(svgText, sfx){
  var c = pbarCompile(svgText);
  if (c.err || !c.rows.length){
    showViewMsg(c.err || '这条没有可用的表达式');
    CUR = null;
    return c;
  }
  clearView();
  var holder = document.createElement('div');
  holder.innerHTML = pbarUniq(c.svg, sfx || '-v');
  var svg = holder.querySelector('svg');
  if (!svg){ showViewMsg('没解析出 <svg>'); CUR = null; return c; }
  if (!svg.getAttribute('viewBox')) svg.setAttribute('viewBox', '0 0 ' + c.canvas.w + ' ' + c.canvas.h);
  svg.removeAttribute('width');
  svg.removeAttribute('height');
  root.appendChild(svg);
  var els = [svg].concat(Array.prototype.slice.call(svg.querySelectorAll('*')));
  CUR = { rows: c.rows, fns: c.fns, els: els, svg: svg, canvas: c.canvas, compile: c,
          base: baseVB(svgText) };
  return c;
}

/* 把「选中这条」的改动画到预览上：颜色 / 不透明度 / viewBox（大小与位置）。
   每次都从 base 重算，所以来回拖滑杆不会越缩越小 */
function applyOv(){
  if (!CUR || !CUR.svg){
    viewEl.style.color = state.ink;
    return;
  }
  var ov = ovOf(state.sel);
  viewEl.style.color = ov.c || state.ink;
  CUR.svg.style.opacity = (ov.op == null ? 1 : ov.op);
  CUR.svg.setAttribute('viewBox', vbStr(vbFor(CUR.base, ov)));
}

var errCount = 0;
function paint(pct, i, count){
  if (!CUR) return;
  errCount = 0;
  for (var r = 0; r < CUR.rows.length; r++){
    var el = CUR.els[CUR.rows[r][0]];
    var f = pbarFnOf(CUR.fns[CUR.rows[r][2]]);
    if (!el || !f) continue;
    var args = PBAR_ARGS.map(function(a){ return pbarArgVal(a, pct, i, count); });
    try { el.setAttribute(CUR.rows[r][1], f.apply(null, args)); }
    catch (e){ errCount++; }
  }
  if (state.fillField){
    Array.prototype.forEach.call(CUR.svg.querySelectorAll('[data-reader-field]'), function(tx){
      var k = String(tx.getAttribute('data-reader-field') || '');
      if (/page/i.test(k)) tx.textContent = (i + 1) + '/' + count;
      else if (/progress|percent|pct/i.test(k)) tx.textContent = (Math.round(pct * 10) / 10) + '%';
    });
  }
}

/* =========================================================================
   5. 尺寸 / 配色
   ========================================================================= */
var paper = document.getElementById('paper');
var paperFit = document.getElementById('paperFit');
var zoomBadge = document.getElementById('zoomBadge');
var stagewrap = document.getElementById('stagewrap');
var stageNote = document.getElementById('stageNote');

function applyPaper(){
  var w = state.width;
  paper.style.width = w + 'px';
  paper.style.background = state.bg;
  paper.style.color = state.ink;
  Array.prototype.forEach.call(document.getElementById('bgSw').children, function(el){
    el.classList.toggle('on', el.getAttribute('data-bg') === state.bg);
  });
  /* 纸面墨色给正文占位用；进度条自己的颜色在 applyOv 里定（跟随正文 = 用这个墨色） */
  paper.querySelector('.cap').style.color = state.ink;
  applyOv();
  stageNote.textContent = '';  /* 缩放：1× 就是真机上的实际粗细 —— 这类图形只有几十像素高，看不清是常态，
     所以给 2×/3× 放大看细节。用 transform + 外层垫片，避免 zoom 在 flex 里算不准宽度 */
  var ph = paper.offsetHeight || 212;
  var avail = Math.max(120, stagewrap.clientWidth - 40);
  var z = Math.max(0.3, Math.min(state.zoom || 1, avail / w));
  paper.style.transform = 'scale(' + z + ')';
  paperFit.style.width = Math.round(w * z) + 'px';
  paperFit.style.height = Math.round(ph * z) + 'px';
  zoomBadge.textContent = '实际 ' + w + 'px'
    + (z > 1.02 ? ' · 放大 ' + z.toFixed(1) + '×' : (z < 0.98 ? ' · 缩至 ' + (z * 100).toFixed(0) + '%' : ''));
  Array.prototype.forEach.call(document.getElementById('zoomCtl').children, function(b){
    b.classList.toggle('on', parseInt(b.getAttribute('data-z'), 10) === (state.zoom || 1));
  });
  /* 1× 就是真机大小：这类图形本来就只有二三十像素高，看着淡是正常的，别当成坏了 */
  stageNote.textContent = z < 1.02
    ? '这是真机上的实际大小，细是正常的 —— 左上角 2× / 3× 可放大看细节'
    : '放大查看中，实际尺寸仍是 ' + w + 'px 宽';
  updateLines();
}
function updateLines(){
  var ls = paper.querySelector('.lines');
  ls.style.display = state.showLines ? 'flex' : 'none';
  ls.style.color = state.ink;
}

/* =========================================================================
   6. 控制
   ========================================================================= */
var rng = document.getElementById('rng');
var pval = document.getElementById('pval');
var pgnum = document.getElementById('pgnum');
var metaEl = document.getElementById('meta');

function pageOfPct(pct, count){
  var i = Math.round(pct / 100 * count);
  if (i < 1) i = 1;
  if (i > count) i = count;
  return i;
}
function frame(){
  var pct = state.pct;
  var count = state.count;
  var i = pageOfPct(pct, count);
  paint(pct, i, count);
  pval.textContent = (Math.round(pct * 10) / 10).toFixed(1) + '%';
  rng.value = pct;
  rng.style.setProperty('--pp', pct + '%');
  pgnum.innerHTML = '第 <b>' + i + '</b> / ' + count + ' 页';
  meta();
}
function meta(){
  var it = itemById(state.sel);
  if (!it){ metaEl.innerHTML = ''; return; }
  var c = pbarCompile(it.svg);
  var cv = c.canvas || { w: 0, h: 0 };
  var ratio = cv.h ? (cv.w / cv.h) : 0;
  var hh = state.width ? Math.round(state.width / (ratio || 1)) : 0;
  var seg = [];
  seg.push('<span><b>' + cv.w + '×' + cv.h + '</b> 画布</span>');
  seg.push('<span>实高 <b>' + hh + 'px</b></span>');
  seg.push('<span>表达式 <b>' + c.rows.length + '</b> 处 · 函数 <b>' + c.fns.length + '</b> 个</span>');
  if (c.clipRows) seg.push('<span>裁剪 <b>' + c.clipRows + '</b> 处</span>');
  seg.push('<span>' + mechOf(it.svg) + '</span>');
  if (c.bad.length) seg.push('<span class="warn">被拒 ' + c.bad.length + '：' + esc(c.bad[0]) + '</span>');
  if (errCount) seg.push('<span class="warn">求值出错 ' + errCount + '</span>');
  metaEl.innerHTML = seg.join('');
}

function selectItem(id){
  var it = itemById(id);
  if (!it) return;
  state.sel = id;
  saveStore();
  THUMB_CACHE.clear();
  renderList();
  mount(it.svg, '-v');
  applyPaper();
  frame();
  syncInsp();
}

rng.addEventListener('input', function(){
  state.pct = parseFloat(rng.value) || 0;
  frame();
  saveStore();
});
function stepPage(d){
  var count = state.count;
  var i = pageOfPct(state.pct, count) + d;
  if (i < 1) i = 1;
  if (i > count) i = count;
  state.pct = Math.round(i / count * 1000) / 10;
  frame();
  saveStore();
}
document.getElementById('prev').addEventListener('click', function(){ stepPage(-1); });
document.getElementById('next').addEventListener('click', function(){ stepPage(1); });
document.getElementById('rand').addEventListener('click', function(){
  var i = 1 + Math.floor(Math.random() * state.count);
  state.pct = Math.round(i / state.count * 1000) / 10;
  frame();
  saveStore();
});
document.getElementById('cSegs').addEventListener('click', function(e){
  var b = e.target.closest('.seg'); if (!b) return;
  state.count = parseInt(b.getAttribute('data-c'), 10) || 12;
  Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle('on', x === b); });
  frame(); saveStore();
});
document.getElementById('wSegs').addEventListener('click', function(e){
  var b = e.target.closest('.seg'); if (!b) return;
  var w = parseInt(b.getAttribute('data-w'), 10);
  var wrap = document.getElementById('wCustomWrap');
  if (w === 0){
    wrap.style.display = 'block';
    w = state.customW || 360;
    var inp = document.getElementById('wCustom');
    inp.value = w; inp.focus(); inp.select();
  } else {
    wrap.style.display = 'none';
    state.customW = w;
  }
  state.width = w;
  Array.prototype.forEach.call(this.children, function(x){ x.classList.toggle('on', x === b); });
  applyPaper(); meta();
  saveStore();
});
document.getElementById('wCustom').addEventListener('input', function(){
  var v = parseInt(this.value, 10);
  if (!(v >= 120)) return;
  v = Math.min(900, v);
  state.customW = v; state.width = v;
  applyPaper(); meta(); saveStore();
});
document.getElementById('bgSw').addEventListener('click', function(e){
  var el = e.target.closest('i'); if (!el) return;
  state.bg = el.getAttribute('data-bg');
  state.ink = el.getAttribute('data-ink');
  applyPaper(); saveStore();
});
document.getElementById('zoomCtl').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  state.zoom = parseInt(b.getAttribute('data-z'), 10) || 1;
  applyPaper(); saveStore();
});
/* ---------------- 右栏：选中这一条 ---------------- */
var insEmpty = document.getElementById('insEmpty');
var insForm = document.getElementById('insForm');
var insNameEl = document.getElementById('insName');
var insDirtyEl = document.getElementById('insDirty');
var edName = document.getElementById('edName');
var edColor = document.getElementById('edColor');
var edHex = document.getElementById('edHex');
var edFollow = document.getElementById('edFollow');
var edColorState = document.getElementById('edColorState');
var edOp = document.getElementById('edOp'), edOpV = document.getElementById('edOpV');
var edSc = document.getElementById('edSc'), edScV = document.getElementById('edScV');
var edDx = document.getElementById('edDx'), edDxV = document.getElementById('edDxV');
var edDy = document.getElementById('edDy'), edDyV = document.getElementById('edDyV');

var SLIDERS = [[edOp, 20, 100], [edSc, 40, 100], [edDx, -30, 30], [edDy, -30, 30]];
function syncVals(){
  edOpV.textContent = edOp.value + '%';
  edScV.textContent = edSc.value + '%';
  edDxV.textContent = edDx.value + '%';
  edDyV.textContent = edDy.value + '%';
  SLIDERS.forEach(function(a){
    a[0].style.setProperty('--pp', ((a[0].value - a[1]) / (a[2] - a[1]) * 100) + '%');
  });
}
function syncInsp(){
  var it = itemById(state.sel);
  if (!it){
    insEmpty.style.display = 'block';
    insForm.style.display = 'none';
    insNameEl.textContent = '—';
    insDirtyEl.innerHTML = '';
    return;
  }
  insEmpty.style.display = 'none';
  insForm.style.display = 'block';
  insNameEl.textContent = it.name;
  insDirtyEl.innerHTML = it.dirty ? '<span class="dirty">已改</span>' : '';
  var ov = ovOf(it.id);
  edName.value = it.name;
  edColor.value = ov.c || '#4f6ef2';
  edHex.value = ov.c || '';
  edColorState.textContent = ov.c ? '固定色' : '跟随正文';
  edOp.value = Math.round((ov.op == null ? 1 : ov.op) * 100);
  edSc.value = ov.sc == null ? 100 : ov.sc;
  edDx.value = ov.dx || 0;
  edDy.value = ov.dy || 0;
  syncVals();
}

function touch(){          /* 改完之后统一做的事 */
  applyOv();
  meta();
  syncInsp();
}
function touchList(){      /* 需要重画列表的（缩略图 / 名字 / 角标） */
  THUMB_CACHE.clear();
  renderList();
}

edName.addEventListener('change', function(){
  var v = String(this.value || '').trim().slice(0, 24);
  if (!v){ syncInsp(); return; }
  setOv(state.sel, { name: v });
  touchList(); syncInsp();
});
edName.addEventListener('keydown', function(e){ if (e.key === 'Enter') this.blur(); });

edColor.addEventListener('input', function(){
  setOv(state.sel, { c: this.value });
  edHex.value = this.value;
  edColorState.textContent = '固定色';
  touch(); touchList();
});
edHex.addEventListener('change', function(){
  var v = String(this.value || '').trim();
  if (/^[0-9a-fA-F]{6}$/.test(v)) v = '#' + v;
  if (!/^#[0-9a-fA-F]{6}$/.test(v)){ this.value = ovOf(state.sel).c || ''; toast('色值要写成 #aabbcc'); return; }
  setOv(state.sel, { c: v.toLowerCase() });
  edColor.value = v;
  edColorState.textContent = '固定色';
  touch(); touchList();
});
edFollow.addEventListener('click', function(){
  setOv(state.sel, { c: '' });
  touch(); touchList();
});

[[edOp, 'op', 100], [edSc, 'sc', 1], [edDx, 'dx', 1], [edDy, 'dy', 1]].forEach(function(a){
  var el = a[0], key = a[1], div = a[2];
  el.addEventListener('input', function(){
    var v = parseFloat(this.value) || 0;
    if (key === 'op') setOv(state.sel, { op: Math.round(v) / 100 });
    else if (key === 'sc') setOv(state.sel, { sc: Math.round(v) });
    else setOv(state.sel, { [key]: Math.round(v) });
    syncVals();
    applyOv();
    meta();
  });
  el.addEventListener('change', function(){ touchList(); syncInsp(); });
});

document.getElementById('edReset').addEventListener('click', function(){
  var id = state.sel;
  if (!hasOv(id)){ toast('这条还没改过'); return; }
  delete store.ov[id];
  saveStore();
  selectItem(id);
  toast('已撤销这条的改动');
});
document.getElementById('edDup').addEventListener('click', function(){
  var it = itemById(state.sel);
  if (!it) return;
  var id = 'u' + Date.now().toString(36);
  store.custom.push({ id: id, name: it.name + ' 副本', svg: bake(it) });
  delete store.ov[id];
  saveStore();
  touchList();
  selectItem(id);
  toast('已复制一份，改副本不影响原来那条');
});
document.getElementById('edDel').addEventListener('click', function(){
  var it = itemById(state.sel);
  if (!it) return;
  delItem(it.id);
});
document.getElementById('edSrc').addEventListener('click', function(){
  var it = itemById(state.sel);
  if (!it) return;
  openDlg('edit');
});

document.getElementById('optLines').addEventListener('change', function(){
  state.showLines = this.checked; updateLines(); saveStore();
});
document.getElementById('optField').addEventListener('change', function(){
  state.fillField = this.checked;
  frame(); saveStore();
});
qEl.addEventListener('input', function(){ renderList(); });
cntEl.addEventListener('click', function(e){
  if (!e.target.closest('#unhide')) return;
  store.hide = [];
  saveStore();
  renderList();
});

function clearStage(){
  showViewMsg('列表空了 —— 点右上「导入」加一条，或用上面「恢复」把内置的找回来');
  CUR = null;
  syncInsp();
  metaEl.innerHTML = '';
}
function delItem(id){
  var idx = -1;
  store.custom.forEach(function(c, i){ if ((c.id || ('c' + i)) === id) idx = i; });
  if (idx >= 0) store.custom.splice(idx, 1);
  else if (store.hide.indexOf(id) < 0) store.hide.push(id);     /* 内置的只是先藏起来 */
  delete store.ov[id];
  if (state.sel === id) state.sel = '';
  saveStore(); THUMB_CACHE.clear(); renderList();
  if (state.sel && itemById(state.sel)){ syncInsp(); return; }
  var next = allItems()[0];
  if (next) selectItem(next.id); else clearStage();
}

lstBody.addEventListener('click', function(e){
  var x = e.target.closest('[data-del]');
  if (x){ delItem(x.getAttribute('data-del')); return; }
  var row = e.target.closest('.row');
  if (row && state.sel !== row.getAttribute('data-id')) selectItem(row.getAttribute('data-id'));
});
lstBody.addEventListener('change', function(e){
  var inp = e.target.closest('[data-nm]');
  if (!inp) return;
  var id = inp.getAttribute('data-nm');
  var v = String(inp.value || '').trim().slice(0, 24);
  if (!v){ renderList(); return; }
  setOv(id, { name: v });
  if (state.sel === id) syncInsp();
  meta();
});
lstBody.addEventListener('keydown', function(e){
  if (e.target.closest('[data-nm]') && e.key === 'Enter') e.target.blur();
});

window.addEventListener('resize', function(){ applyPaper(); });
document.addEventListener('keydown', function(e){
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowLeft'){ stepPage(-1); e.preventDefault(); }
  if (e.key === 'ArrowRight'){ stepPage(1); e.preventDefault(); }
  if (e.key === 'ArrowDown'){ state.pct = Math.max(0, state.pct - 2); frame(); e.preventDefault(); }
  if (e.key === 'ArrowUp'){ state.pct = Math.min(100, state.pct + 2); frame(); e.preventDefault(); }
});

/* =========================================================================
   7. 导入 / 导出 / 校验
   ========================================================================= */
var mask = document.getElementById('mask');
var dlgT = document.getElementById('dlgT');
var dlgHint = document.getElementById('dlgHint');
var dlgTa = document.getElementById('dlgTa');
var dlgRes = document.getElementById('dlgRes');
var dlgOk = document.getElementById('dlgOk');
var dlgCheck = document.getElementById('dlgCheck');
var dlgMode = 'import';

function openDlg(mode){
  dlgMode = mode;
  mask.classList.add('on');
  dlgRes.style.display = 'none';
  var it = itemById(state.sel);
  document.getElementById('pickRow').style.display = mode === 'edit' ? 'none' : 'flex';
  if (mode === 'edit'){
    dlgT.textContent = '改这一条的源码';
    dlgHint.innerHTML = '这是这条现在的 SVG。改完点「校验并保存」——不合法会拦下来告诉你哪里错，合法就替换掉这一条。'
      + '（颜色/大小/位置不用在这里改，右栏那几个滑杆就行）';
    dlgTa.value = it ? it.svg : '';
    dlgOk.textContent = '校验并保存';
    dlgOk.style.display = '';
    setTimeout(function(){ dlgTa.focus(); }, 60);
    return;
  }
  if (mode === 'import'){
    dlgT.textContent = '导入进度条';
    dlgHint.innerHTML = '点上面「选择文件」挑 <code>.svg</code> / <code>.txt</code>（可以多选），或者把源码贴进下面的框。'
      + '导入时会做白名单校验：表达式里只允许 <code>数字 + - * / ( )</code>、12 个变量、8 个函数。';
    dlgTa.value = '';
    dlgOk.textContent = '把框里的加进列表';
    dlgOk.style.display = '';
  } else {
    dlgT.textContent = '校验一条 SVG';
    dlgHint.innerHTML = '不改任何东西，只告诉你：画布多大、有多少处表达式、哪些会被拒、该怎么改。';
    dlgTa.value = '';
    dlgOk.style.display = 'none';
  }
  setTimeout(function(){ dlgTa.focus(); }, 60);
}
document.getElementById('btnImport').addEventListener('click', function(){ openDlg('import'); });
document.getElementById('dlgX').addEventListener('click', function(){ mask.classList.remove('on'); });
mask.addEventListener('click', function(e){ if (e.target === mask) mask.classList.remove('on'); });

/* 为什么会不合法：把最常见的几种写法直接点名，省得对着「含不支持的字符」猜 */
function exprWhy(body){
  if (/\{=|\}/.test(body)) return '表达式里又套了花括号';
  if (/[?:]/.test(body)) return '不能写三目，用 max(0, min(1, (x - a) / b)) 夹出来';
  if (/%/.test(body)) return '不能取模，用 x - floor(x / 2) * 2 代替';
  if (/&&|\|\|/.test(body)) return '不能写 && / ||，改成乘法或加法';
  if (/[<>=!]/.test(body)) return '不能比较大小，用 max / min 夹';
  if (/[[\]]/.test(body)) return '不能用数组';
  if (/[\u4e00-\u9fa5]/.test(body)) return '不能写中文';
  return '';
}
function checkText(text){
  var t = String(text || '').replace(/^\uFEFF/, '').trim();
  var i = t.indexOf('<svg'), j = t.lastIndexOf('</svg>');
  if (i < 0) return { ok: false, why: '里面没有 <svg>', msg: '没找到 <svg> 标签' };
  t = j > i ? t.slice(i, j + 6) : t.slice(i);
  var c = pbarCompile(t);
  var cv = c.canvas || pbarCanvasOf(t);
  var lines = [];
  lines.push('画布 <b>' + cv.w + '×' + cv.h + '</b>' + (cv.h ? '（' + (cv.w / cv.h).toFixed(2) + ':1）' : ''));
  lines.push('表达式 <b>' + c.rows.length + '</b> 处，去重后 <b>' + c.fns.length + '</b> 个函数');
  if (c.clipRows) lines.push('裁剪型 <b>' + c.clipRows + '</b> 处（data-progress）');
  lines.push('机制：' + esc(mechOf(t)));
  if (c.err) lines.push('<span style="color:#b91c1c">解析失败：' + esc(c.err) + '</span>');
  /* 逐条点名：原表达式 → 原因 → 怎么改
     注意：必须扫「摊平后」的文本 —— 供应商模板里 {= w / 1072 }、{= h / 96 } 里的
     w / h 只有 pbarPrep 之后才变成数字，扫原文本会误判成「不认识的变量 w」，
     于是整条明明能画却被拒之门外（Lovia 那批「可自调宽高」的模板就是这么挂的）。 */
  var bads = [];
  (String(c.svg || t).match(/\{=[^}]*\}/g) || []).forEach(function(m){
    var body = m.slice(2, -1);
    var err = pbarBadExpr(body);
    if (!err) return;
    var why = exprWhy(body);
    bads.push('· <code>' + esc(body.trim().slice(0, 44)) + '</code> → ' + esc(err)
      + (why ? '<br>&nbsp;&nbsp;' + esc(why) : ''));
  });
  if (bads.length){
    lines.push('<span style="color:#b91c1c">会被拒 ' + bads.length + ' 处：</span>');
    bads.slice(0, 4).forEach(function(b){ lines.push(b); });
    if (bads.length > 4) lines.push('· …还有 ' + (bads.length - 4) + ' 处');
  }
  var ok = !c.err && !bads.length && c.rows.length > 0;
  var why = c.err ? ('解析失败：' + c.err)
    : bads.length ? ('有 ' + bads.length + ' 处表达式不合法')
      : !c.rows.length ? '里面没有随进度变化的表达式' : '';
  return { ok: ok, why: why, msg: lines.join('<br>'), svg: t, name: nameOf(t, '') };
}
function showRes(r){
  dlgRes.style.display = 'block';
  dlgRes.className = 'res ' + (r.ok ? 'ok' : 'bad');
  dlgRes.innerHTML = (r.ok ? '<b>可以导入</b><br>' : '<b>不能导入</b><br>') + r.msg;
}
dlgCheck.addEventListener('click', function(){
  var r = checkText(dlgTa.value);
  showRes(r);
});
dlgOk.addEventListener('click', function(){
  var r = checkText(dlgTa.value);
  showRes(r);
  if (!r.ok) return;
  if (dlgMode === 'edit'){
    var it = itemById(state.sel);
    if (!it) return;
    /* 源码换了，画布可能也变了，旧的大小/位置是按老画布算的，一并清掉 */
    setOv(it.id, { src: r.svg, sc: '', dx: '', dy: '' });
    THUMB_CACHE.clear();
    selectItem(it.id);
    mask.classList.remove('on');
    toast('已保存，这条现在用你改过的源码');
    return;
  }
  addCustom(nameOf(r.svg, ''), r.svg);
  mask.classList.remove('on');
});

var uidSeq = 0;
function newId(){ return 'u' + Date.now().toString(36) + '-' + (++uidSeq); }
function addCustom(name, svg, silent){
  var used = allItems().map(function(x){ return x.name; });
  var nm = name || '未命名';
  if (used.indexOf(nm) >= 0){
    var k = 2;
    while (used.indexOf(nm + ' ' + k) >= 0) k++;
    nm = nm + ' ' + k;
  }
  var id = newId();
  store.custom.push({ id: id, name: nm, svg: svg });
  saveStore();
  THUMB_CACHE.clear();
  renderList();
  selectItem(id);
  if (!silent) toast('已加入：' + nm);
  return id;
}

/* 选文件 / 拖文件都走这里；.txt 和 .svg 一视同仁 —— 认的是内容里有没有 <svg> */
var fileIn = document.getElementById('fileIn');
document.getElementById('pickBtn').addEventListener('click', function(){ fileIn.click(); });
fileIn.addEventListener('change', function(){
  var fs = fileIn.files;
  if (fs && fs.length) readFiles(fs, function(n){ if (n) mask.classList.remove('on'); });
  fileIn.value = '';
});

function readFiles(fs, onDone){
  var arr = Array.prototype.slice.call(fs);
  if (!arr.length) return;
  var pending = arr.length, ok = 0, bad = [];
  function done(){
    if (--pending > 0) return;
    var msg = ok ? ('导入 ' + ok + ' 条') : '一条都没导进来';
    if (bad.length) msg += '；跳过 ' + bad.length + ' 个 —— ' + bad.slice(0, 2).join(' ／ ') + (bad.length > 2 ? ' …' : '');
    toast(msg.length > 90 ? msg.slice(0, 90) + '…' : msg);
    if (onDone) onDone(ok);
  }
  arr.forEach(function(f){
    var fr = new FileReader();
    fr.onload = function(){
      var r = checkText(fr.result);
      if (r.ok){ addCustom(nameOf(r.svg, f.name), r.svg, true); ok++; }
      else bad.push(f.name + '：' + (r.why || '不是进度条 SVG'));
      done();
    };
    fr.onerror = function(){ bad.push(f.name + '：读不出来'); done(); };
    fr.readAsText(f, 'utf-8');
  });
}

/* 拖放：任何文件都收，先看内容再判断，比按后缀拦更不容易冤杀 */
var dropEl = document.getElementById('drop');
var dragDepth = 0;
window.addEventListener('dragenter', function(e){
  if (!e.dataTransfer || Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') < 0) return;
  dragDepth++; dropEl.classList.add('on');
});
window.addEventListener('dragleave', function(){ dragDepth--; if (dragDepth <= 0){ dragDepth = 0; dropEl.classList.remove('on'); } });
window.addEventListener('dragover', function(e){ e.preventDefault(); });
window.addEventListener('drop', function(e){
  e.preventDefault();
  dragDepth = 0; dropEl.classList.remove('on');
  var fs = e.dataTransfer && e.dataTransfer.files;
  if (fs && fs.length) readFiles(fs);
});

/* 导出：把右栏的改动烘进 svg —— 不是只在这里预览 */
function bake(it){
  var s = String(it.svg || '');
  var ov = ovOf(it.id);
  var vb = vbFor(baseVB(s), ov);
  var wrapped = false;
  s = s.replace(/<svg\b[^>]*>/i, function(tag){
    var t = tag;
    if (/\bviewBox\s*=\s*"/i.test(t)) t = t.replace(/viewBox\s*=\s*"[^"]*"/i, 'viewBox="' + vbStr(vb) + '"');
    else t = t.replace(/\s*\/?>$/, ' viewBox="' + vbStr(vb) + '">');
    return t;
  });
  var st = [];
  if (ov.c) st.push('color:' + ov.c);
  if (ov.op != null && ov.op < 0.999) st.push('opacity:' + (Math.round(ov.op * 100) / 100));
  if (st.length){
    s = s.replace(/<svg\b[^>]*>/i, function(tag){ wrapped = true; return tag + '<g style="' + st.join(';') + '">'; });
    s = s.replace(/<\/svg>\s*$/i, '</g></svg>');
  }
  return s;
}
function svgForExport(it){
  var s = bake(it);
  /* 顺手把名字写进 data-name，导入制作器时列表上就是这个名字 */
  if (s.indexOf('data-name=') < 0){
    s = s.replace(/<svg\b/i, '<svg data-name="' + String(it.name).replace(/"/g, '&quot;') + '"');
  }
  return s;
}
function download(name, text, mime){
  try {
    var b = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1200);
    return true;
  } catch (e){ return false; }
}
document.getElementById('btnSave').addEventListener('click', function(){
  var it = itemById(state.sel);
  if (!it){ toast('先选一条'); return; }
  var name = String(it.name).replace(/[\\/:*?"<>|]/g, '_') + '.txt';
  if (download(name, svgForExport(it))){
    toast('已下载 ' + name + '（浏览器预览面板里可能拦下载，用系统浏览器打开本页）');
  } else toast('下载失败');
});

/* 极简 zip（store 不压缩），中文名用 UTF-8 + EFS 标记 */
var CRC_T = (function(){
  var t = new Int32Array(256);
  for (var n = 0; n < 256; n++){
    var c = n;
    for (var k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c;
  }
  return t;
})();
function crc32(u8){
  var c = -1;
  for (var i = 0; i < u8.length; i++) c = CRC_T[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ -1) >>> 0;
}
function zipStore(files){
  var enc = new TextEncoder();
  var parts = [], cds = [], off = 0, DT = 0x0021, TM = 0x0000;
  files.forEach(function(f){
    var nm = enc.encode(f.name), data = f.data, crc = crc32(data);
    var lh = new Uint8Array(30 + nm.length), dv = new DataView(lh.buffer);
    dv.setUint32(0, 0x04034b50, true); dv.setUint16(4, 20, true); dv.setUint16(6, 0x0800, true);
    dv.setUint16(8, 0, true); dv.setUint16(10, TM, true); dv.setUint16(12, DT, true);
    dv.setUint32(14, crc, true); dv.setUint32(18, data.length, true); dv.setUint32(22, data.length, true);
    dv.setUint16(26, nm.length, true); dv.setUint16(28, 0, true);
    lh.set(nm, 30);
    parts.push(lh, data);
    var cd = new Uint8Array(46 + nm.length), cv = new DataView(cd.buffer);
    cv.setUint32(0, 0x02014b50, true); cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0x0800, true); cv.setUint16(10, 0, true); cv.setUint16(12, TM, true);
    cv.setUint16(14, DT, true); cv.setUint32(16, crc, true); cv.setUint32(20, data.length, true);
    cv.setUint32(24, data.length, true); cv.setUint16(28, nm.length, true);
    cv.setUint16(30, 0, true); cv.setUint16(32, 0, true); cv.setUint16(34, 0, true);
    cv.setUint16(36, 0, true); cv.setUint32(38, 0, true); cv.setUint32(42, off, true);
    cd.set(nm, 46);
    cds.push(cd);
    off += lh.length + data.length;
  });
  var cdSize = cds.reduce(function(a, b){ return a + b.length; }, 0);
  var eo = new Uint8Array(22), ev = new DataView(eo.buffer);
  ev.setUint32(0, 0x06054b50, true); ev.setUint16(8, files.length, true); ev.setUint16(10, files.length, true);
  ev.setUint32(12, cdSize, true); ev.setUint32(16, off, true);
  return new Blob(parts.concat(cds, [eo]), { type: 'application/zip' });
}
document.getElementById('btnZip').addEventListener('click', function(){
  var list = allItems();
  if (!list.length) return;
  var enc = new TextEncoder();
  var files = list.map(function(it){
    var nm = String(it.name).replace(/[\\/:*?"<>|]/g, '_') + '.txt';
    return { name: nm, data: enc.encode(svgForExport(it)) };
  });
  /* 重名去重 */
  var seen = {};
  files.forEach(function(f){
    if (seen[f.name]){ f.name = f.name.replace(/\.txt$/, ' ' + (++seen[f.name]) + '.txt'); }
    else seen[f.name] = 1;
  });
  try {
    var blob = zipStore(files);
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '进度条-' + list.length + '条.zip';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    toast('已打包 ' + list.length + ' 条');
  } catch (e){ toast('打包失败：' + e.message); }
});

var toastEl = document.getElementById('toast');
var toastTm = 0;
function toast(msg){
  toastEl.textContent = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTm);
  toastTm = setTimeout(function(){ toastEl.classList.remove('on'); }, 2600);
}

/* =========================================================================
   8. 启动
   ========================================================================= */
(function init(){
  /* 尺寸按钮初值 */
  var wm = [260, 320, 360, 420];
  if (wm.indexOf(state.width) < 0){
    document.getElementById('wCustomWrap').style.display = 'block';
    document.getElementById('wCustom').value = state.customW || state.width || 360;
  }
  Array.prototype.forEach.call(document.getElementById('wSegs').children, function(b){
    var w = parseInt(b.getAttribute('data-w'), 10);
    b.classList.toggle('on', w === state.width || (w === 0 && wm.indexOf(state.width) < 0));
  });
  Array.prototype.forEach.call(document.getElementById('cSegs').children, function(b){
    b.classList.toggle('on', parseInt(b.getAttribute('data-c'), 10) === state.count);
  });
  document.getElementById('optLines').checked = state.showLines;
  document.getElementById('optField').checked = state.fillField;

  renderList();
  var first = null;
  if (state.sel) first = itemById(state.sel);
  if (!first) first = allItems()[0];
  if (first) selectItem(first.id);
  else clearStage();
  applyPaper();
})();
</script>
