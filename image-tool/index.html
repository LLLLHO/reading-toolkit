<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#ffffff">
<title>调色台 · 局部改色与色调统一</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-pick" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3.2M12 18.3v3.2M2.5 12h3.2M18.3 12h3.2"/></symbol>
  <symbol id="i-brush" viewBox="0 0 24 24"><path d="M4 20l4.5-1 9-9-3.5-3.5-9 9L4 20z"/><path d="M13.5 6.5L17 10"/></symbol>
  <symbol id="i-erase" viewBox="0 0 24 24"><path d="M8.5 20H20"/><path d="M15.5 4.5l4 4-9.5 9.5H6l-2-2 11.5-11.5z"/></symbol>
  <symbol id="i-wand" viewBox="0 0 24 24"><path d="M14 10l-8.5 8.5 2 2L16 12"/><path d="M16 3v3M16 9v1M11.5 6.5h-2M21 6.5h-2"/></symbol>
  <symbol id="i-lasso" viewBox="0 0 24 24"><path d="M12 4.5c4.4 0 8 2.2 8 5s-3.6 5-8 5-8-2.2-8-5 3.6-5 8-5z"/><path d="M9 14.6c0 2.4 2 3 2 4.6a1.6 1.6 0 003.2 0"/></symbol>
  <symbol id="i-hand" viewBox="0 0 24 24"><path d="M9 11V5.5a1.5 1.5 0 013 0V11"/><path d="M12 11V4.5a1.5 1.5 0 013 0V11"/><path d="M15 11V6.5a1.5 1.5 0 013 0V14a6 6 0 01-6 6h-1a6 6 0 01-6-6v-3a1.5 1.5 0 013 0"/></symbol>
  <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></symbol>
  <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H10a6 6 0 000 12h3"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-open" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3 15l5-4 4 3 3-2 6 4"/></symbol>
  <symbol id="i-compare" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M12 4v16"/><path d="M6.5 9.5h2.5M6.5 13.5h3.5"/></symbol>
  <symbol id="i-down" viewBox="0 0 24 24"><path d="M12 3.5v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M4 19.5h16"/></symbol>
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
</svg>

<div class="app" data-mode="single">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark"></span>
      <span class="brand-name">调色台</span>
    </div>
    <div class="tabs" id="tabs">
      <button class="tab is-on" data-tab="single">局部改色</button>
      <button class="tab" data-tab="harmonize">色调统一</button>
    </div>
    <div class="meta" id="meta"></div>
    <div class="top-actions">
      <button class="btn" id="btnOpen"><svg class="ico"><use href="#i-open"/></svg><span>打开</span></button>
      <button class="btn" id="btnCompare"><svg class="ico"><use href="#i-compare"/></svg><span>对比</span></button>
      <button class="btn btn-primary" id="btnExport"><svg class="ico"><use href="#i-down"/></svg><span>导出</span></button>
    </div>
  </header>

  <div class="body">
    <div class="toolbar" id="toolbar">
      <button class="tool is-on" data-tool="pick" title="点选同类色"><svg class="ico"><use href="#i-pick"/></svg><em>点选</em></button>
      <button class="tool" data-tool="brush" title="笔刷"><svg class="ico"><use href="#i-brush"/></svg><em>笔刷</em></button>
      <button class="tool" data-tool="erase" title="擦除"><svg class="ico"><use href="#i-erase"/></svg><em>擦除</em></button>
      <button class="tool" data-tool="wand" title="魔棒"><svg class="ico"><use href="#i-wand"/></svg><em>魔棒</em></button>
      <button class="tool" data-tool="lasso" title="套索"><svg class="ico"><use href="#i-lasso"/></svg><em>套索</em></button>
      <button class="tool" data-tool="pan" title="移动画布"><svg class="ico"><use href="#i-hand"/></svg><em>移动</em></button>
      <div class="tool-sep"></div>
      <button class="tool" data-act="undo" title="撤销"><svg class="ico"><use href="#i-undo"/></svg><em>撤销</em></button>
      <button class="tool" data-act="redo" title="重做"><svg class="ico"><use href="#i-redo"/></svg><em>重做</em></button>
      <button class="tool" data-act="clear" title="清空选区"><svg class="ico"><use href="#i-x"/></svg><em>清空</em></button>
    </div>

    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <canvas id="loupe" class="loupe"></canvas>
      <div class="zoom-hud"><span id="zoomVal">100%</span></div>
      <div class="empty" id="empty">
        <div class="empty-card">
          <div class="empty-ico"><svg class="ico"><use href="#i-open"/></svg></div>
          <h2>把图片拖进来</h2>
          <p>也可以 Ctrl&nbsp;+&nbsp;V 粘贴，或点击下面的按钮选择</p>
          <div class="empty-btns">
            <button class="btn btn-primary" id="btnPick">选择图片</button>
            <button class="btn" id="btnDemo">用示例图试试</button>
          </div>
        </div>
      </div>
      <div class="busy" id="busy"><div class="spinner"></div><span id="busyText">处理中</span></div>
    </div>

    <aside class="panel" id="panel">
      <div class="sheet-grip" id="sheetGrip"><span></span></div>
      <div class="panel-scroll" id="panelScroll">

        <section class="group" data-only="single">
          <div class="group-title">
            <span>改色层</span>
            <button class="mini" id="btnAddLayer" title="新建一层，用来改另一块区域">＋ 新建</button>
          </div>
          <div class="layers" id="layers"></div>
          <div class="hint" id="layerHint"></div>
        </section>

        <section class="group" data-only="single">
          <div class="group-title">选区</div>
          <div class="seg" id="segAdd">
            <button class="is-on" data-a="1">添加</button>
            <button data-a="0">减去</button>
          </div>
          <div class="row">
            <div class="row-head"><label>笔刷大小</label><output id="oBrush">60 px</output></div>
            <input type="range" id="rBrush" min="4" max="320" step="1" value="60">
          </div>
          <div class="row">
            <div class="row-head"><label>笔刷硬度</label><output id="oHard">70%</output></div>
            <input type="range" id="rHard" min="0" max="100" step="1" value="70">
          </div>
          <div class="row">
            <div class="row-head"><label title="只作用于「点选 / 魔棒」选出来的区域；改完还能随时拖，选区会按新容差重算">颜色容差</label><output id="oTol">16</output></div>
            <input type="range" id="rTol" min="2" max="60" step="1" value="16">
          </div>
          <div class="row">
            <div class="row-head"><label title="改完还能随时拖；每次都从硬边选区重新柔化，不会越调越糊">边缘羽化</label><output id="oFeather">2 px</output></div>
            <input type="range" id="rFeather" min="0" max="40" step="1" value="2">
          </div>
          <div class="mini-row">
            <button class="mini" id="btnAll">全选</button>
            <button class="mini" id="btnInvert">反选</button>
            <button class="mini" id="btnClearMask">清空</button>
          </div>
          <div class="hint" id="maskHint">用「点选」点一下图片上的颜色，就只改那一块</div>
        </section>

        <section class="group" data-only="single">
          <div class="group-title">改色</div>
          <div class="row">
            <div class="row-head"><label>色相</label><output id="oHue">0°</output></div>
            <input type="range" id="rHue" min="-180" max="180" step="1" value="0">
          </div>
          <div class="row">
            <div class="row-head"><label>饱和度</label><output id="oSat">100%</output></div>
            <input type="range" id="rSat" min="0" max="250" step="1" value="100">
          </div>
          <div class="row">
            <div class="row-head"><label>明度</label><output id="oLum">0</output></div>
            <input type="range" id="rLum" min="-40" max="40" step="1" value="0">
          </div>
          <div class="row">
            <div class="row-head"><label>保留明暗</label><output id="oKeep">100%</output></div>
            <input type="range" id="rKeep" min="0" max="100" step="1" value="100">
          </div>
          <div class="row">
            <div class="row-head"><label>目标色</label><output id="oTarget">未设置</output></div>
            <div class="mini-row">
              <button class="mini" id="btnTarget">吸管取色</button>
              <input type="color" id="cTarget" value="#3d7bfd" title="手动指定目标色">
              <button class="mini" id="btnResetTarget">清除</button>
            </div>
          </div>
          <div class="row">
            <div class="row-head"><label>上色强度</label><output id="oTint">0%</output></div>
            <input type="range" id="rTint" min="0" max="100" step="1" value="0">
          </div>
          <div class="row">
            <div class="row-head"><label>生效强度</label><output id="oStrength">100%</output></div>
            <input type="range" id="rStrength" min="0" max="100" step="1" value="100">
          </div>
          <label class="check"><input type="checkbox" id="chkMask"><span>一直显示选区遮罩</span></label>
        </section>

        <section class="group" data-only="harmonize">
          <div class="group-title">图片</div>
          <div class="slots">
            <div class="slot" id="slotRef" data-role="ref">
              <canvas></canvas>
              <div class="slot-tag">参考</div>
              <div class="slot-empty">选择参考图</div>
            </div>
            <div class="slot" id="slotTgt" data-role="tgt">
              <canvas></canvas>
              <div class="slot-tag">待处理</div>
              <div class="slot-empty">选择待处理图</div>
            </div>
          </div>
          <div class="mini-row">
            <button class="mini" id="btnAddMore">添加多张</button>
            <button class="mini" id="btnClearBatch">清空列表</button>
          </div>
        </section>

        <section class="group" data-only="harmonize">
          <div class="group-title">算法</div>
          <div class="seg seg-block" id="segMethod">
            <button data-m="light">轻度</button>
            <button data-m="standard" class="is-on">标准</button>
            <button data-m="strong">强力</button>
          </div>
          <div class="hint" id="methodHint">按色彩统计量对齐明暗与色调，两张内容相近时最自然</div>
          <div class="row">
            <div class="row-head"><label>强度</label><output id="oHStrength">100%</output></div>
            <input type="range" id="rHStrength" min="0" max="100" step="1" value="100">
          </div>
        </section>

        <section class="group" data-only="harmonize">
          <div class="group-title">批量</div>
          <div class="film" id="film"></div>
          <div class="mini-row">
            <button class="mini" id="btnExportAll">全部导出</button>
          </div>
          <div class="hint">一次添加多张时，第 1 张作为参考，其余全部对齐到它</div>
        </section>

      </div>
    </aside>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-card">
    <div class="modal-head">
      <h3>导出图片</h3>
      <button class="icon-btn" id="btnCloseModal"><svg class="ico"><use href="#i-x"/></svg></button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>格式</label>
        <div class="seg" id="segFmt">
          <button class="is-on" data-f="image/png">PNG</button>
          <button data-f="image/jpeg">JPEG</button>
          <button data-f="image/webp">WebP</button>
        </div>
      </div>
      <div class="field">
        <label>尺寸</label>
        <div class="seg" id="segScale">
          <button class="is-on" data-s="1">原始分辨率</button>
          <button data-s="0.5">缩小一半</button>
        </div>
      </div>
      <div class="field" id="qualityField" style="display:none">
        <div class="row-head"><label>质量</label><output id="oQuality">92%</output></div>
        <input type="range" id="rQuality" min="50" max="100" step="1" value="92">
      </div>
      <div class="hint" id="exportHint">PNG 无损，适合改色后的图；JPEG 体积小但会二次压缩。</div>
    </div>
    <div class="modal-foot">
      <button class="btn" id="btnCancelExport">取消</button>
      <button class="btn btn-primary" id="btnDoExport">导出</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>
<input type="file" id="file" accept="image/*" hidden>

<script src="js/color.js"></script>
<script src="js/mask.js"></script>
<script src="js/adjust.js"></script>
<script src="js/app.js"></script>
</body>
</html>
